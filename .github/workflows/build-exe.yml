name: build-exe

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install dependencies
        run: pip install -r requirements-build.txt
      - name: Build with PyInstaller
        run: pyinstaller packaging/tidyup.spec --noconfirm
      - name: Smoke test, CLI version
        run: |
          .\dist\tidyup\tidyup-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw "tidyup-cli --version failed ($LASTEXITCODE)" }
      - name: Smoke test, CLI without Python on PATH
        run: |
          Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $env:PATH = "C:\Windows\System32;C:\Windows"
          & "$env:GITHUB_WORKSPACE\dist\tidyup\tidyup-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "tidyup-cli without Python failed ($LASTEXITCODE)" }
      - name: Smoke test, CLI scan, plan and report on a temp folder
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "tidyup-smoke"
          $files = Join-Path $smoke "files"
          New-Item -ItemType Directory -Force -Path $files | Out-Null
          Set-Content -Path (Join-Path $files "notes.txt") -Value "hello"
          Set-Content -Path (Join-Path $files "setup.exe") -Value "x"
          $env:TIDYUP_SMOKE = $smoke
          $env:SMOKE_FILES = $files
          python -c "import os; from PIL import Image; Image.new('RGB', (1920, 1080), (30, 60, 90)).save(os.path.join(os.environ['SMOKE_FILES'], 'shot.png'))"
          python -c "import os; from pypdf import PdfWriter; w = PdfWriter(); w.add_blank_page(width=200, height=200); w.write(os.path.join(os.environ['SMOKE_FILES'], 'doc.pdf'))"
          python -c "import os; import docx; d = docx.Document(); d.add_paragraph('Smoke test'); d.save(os.path.join(os.environ['SMOKE_FILES'], 'letter.docx'))"
          $cli = ".\dist\tidyup\tidyup-cli.exe"
          & $cli --config packaging\smoke_config.yaml --dry-run scan
          if ($LASTEXITCODE -ne 0) { throw "dry-run scan failed ($LASTEXITCODE)" }
          foreach ($cmd in "scan", "plan", "report") {
            & $cli --config packaging\smoke_config.yaml $cmd
            if ($LASTEXITCODE -ne 0) { throw "$cmd failed ($LASTEXITCODE)" }
          }
          foreach ($f in "inventory.csv", "manifest.csv", "report.html") {
            if (-not (Test-Path (Join-Path $smoke "work\$f"))) { throw "missing $f in smoke work folder" }
          }
      - name: Smoke test, GUI selftest
        timeout-minutes: 3
        run: |
          $p = Start-Process -FilePath ".\dist\tidyup\tidyup.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "tidyup.exe --selftest failed ($($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: tidyup-windows
          path: dist
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tidyup-windows
      - name: Zip the app
        run: |
          test -f tidyup/tidyup.exe || { echo "tidyup/tidyup.exe is missing from the artifact"; exit 1; }
          zip -r -q tidyup-windows.zip tidyup
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" tidyup-windows.zip --clobber
